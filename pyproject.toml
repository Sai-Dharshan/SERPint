[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serpint"
version = "0.1.0"
description = "Measuring how precisely a Google results page reveals a user's city, and scrubbing screenshots to stop it."
requires-python = ">=3.11,<3.12"

[project.scripts]
serpint = "serpint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
