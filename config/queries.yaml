# 20 queries, each tagged with a tier:
#   explicit_local  - the query asks for something local
#   implicit_local  - the answer naturally varies by place, but the query doesn't say so
#   neutral         - nothing about the query is local. The first four should leak little;
#                     the last five are neutral in wording but plausibly leak (team bias,
#                     state health departments, regional passport offices, pricing).
