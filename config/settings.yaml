# Parameters sent with every Google search. Changing these invalidates comparability
# with already-cached responses, so do it only between collection rounds.
search:
  engine: google
  gl: in
  hl: en
  google_domain: google.co.in
  device: desktop

budget:
  # Hard ceiling on paid SerpAPI searches recorded in the ledger. Going past it needs
  # an explicit --allow-over-budget N on the command line.
  max_searches: 420
  # Also refuse to plan more calls than the SerpAPI account says are left this month.
  check_account: true

paths:
  data_dir: data

scoring:
  # GeoGuessr-style score = 5000 * exp(-distance_km / scale_km).
  # ~ India's bounding-box diagonal (~3,800 km) / 10, mirroring GeoGuessr's map scaling.
  geoguessr_scale_km: 400

seed: 13

# Named subsets of the full 20 x 20 grid (`serpint collect <plan>`; `grid` is everything).
# Plans overlap on purpose: a cell fetched by one plan is reused from cache by the others,
# so running pilot -> core -> grid never pays for the same search twice.
plans:
  # 5 cities x 5 queries = 25 searches, to inspect the response fields first.
  pilot:
    cities: [chennai, coimbatore, delhi, kolkata, guwahati]
    queries: [weather, best_biryani, petrol_price_today, how_to_boil_eggs, ipl_score]

  # 16 cities x 15 queries = 240 searches: fits one month of SerpAPI's free tier with a
  # little slack. Contains every pilot cell. Keeps all four same-state pairs, trims the
  # explicit_local tier (the easy ceiling) to two queries. The remaining 160 grid cells
  # (Indore, Patna, Bhubaneswar, Visakhapatnam; best_schools, how_to_make_masala_chai,
  # hospital/atm/movies near me) can be topped up next month with `collect grid`.
  core:
    cities: [
      chennai, coimbatore, mumbai, pune, bengaluru, mysuru, kochi, thiruvananthapuram,
      delhi, chandigarh, jaipur, lucknow, kolkata, guwahati, ahmedabad, hyderabad,
    ]
    queries: [
      weather, restaurants_near_me,
      best_biryani, petrol_price_today, gold_rate_today, flat_for_rent_2bhk, news_today,
      how_to_boil_eggs, python_list_comprehension, convert_kg_to_pounds, ipl_score,
      symptoms_of_dengue, iphone_16_price, what_is_gst, how_to_apply_for_passport,
    ]
